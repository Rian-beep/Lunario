<!doctype html>
<html lang="en" data-ui-theme="dark" class="dark">
<head>
<!-- Prefer dark before first paint; respect an explicit light preference. -->
<script>(function(){try{var k='lunario-ui-theme';var t=localStorage.getItem(k);if(t!=='light'){document.documentElement.setAttribute('data-ui-theme','dark');document.documentElement.classList.add('dark');if(t!=='dark')localStorage.setItem(k,'dark');}}catch(e){document.documentElement.setAttribute('data-ui-theme','dark');document.documentElement.classList.add('dark');}})();</script>
<!-- Loader first. Altitude holds until the navigator iframe is ready, then lands at 0 and reveals. -->
<link rel="stylesheet" href="loader/loader.css">
<script src="loader/loader.js" data-min-duration="3000" data-auto-hide="false" data-altitude="15000"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#0B0D12">
<meta property="og:title" content="Lunario">
<meta property="og:description" content="Lunar south pole landing dashboard">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rian-beep.github.io/Lunario/">
<meta property="og:image" content="https://rian-beep.github.io/Lunario/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<title>Lunario · Dashboard</title>
<meta name="description" content="Compare lunar landing sites and dates: Sun and Earth against the real horizon for power and direct-to-Earth contact.">
</head>
<body class="dash-page">
<!-- Site Dashboard/About live in the cream navigator header (single bar). About keeps the shell nav. -->
<main class="dash dash--live" id="dashboard">
  <div class="dash__mount" id="dashboard-root">
    <p class="dash__status" id="dashboard-status" role="status">
      Loading the lunar landing site navigator…
      <a class="dash__direct" href="navigator/public/solarreach-navigator.html">Open the navigator directly</a>
    </p>
    <iframe
      class="dash__frame"
      id="navigator-frame"
      title="Lunario lunar landing site navigator"
      src="navigator/public/solarreach-navigator.html"
      allow="clipboard-write; fullscreen"
      loading="eager"
    ></iframe>
  </div>
</main>
<script>
(function () {
  var frame = document.getElementById("navigator-frame");
  var status = document.getElementById("dashboard-status");
  var mount = document.getElementById("dashboard-root");
  var settled = false;

  function preferDarkInFrame(doc) {
    try {
      var stored = null;
      try { stored = localStorage.getItem("lunario-ui-theme"); } catch (e) {}
      if (stored === "light") return;
      doc.documentElement.setAttribute("data-ui-theme", "dark");
      doc.documentElement.classList.add("dark");
      try {
        doc.defaultView.localStorage.setItem("lunario-ui-theme", "dark");
      } catch (e2) {}
    } catch (e3) {}
  }

  function injectCreamSiteNav() {
    // Until the offline HTML is rebuilt, stitch a clean About button + orange-accent logo
    // into the cream navigator header (same-origin iframe). Logo is home.
    try {
      var doc = frame && frame.contentDocument;
      if (!doc || !doc.body) return;
      preferDarkInFrame(doc);
      // Prefer the orange-arc wordmark on dark (logo.svg), not flat logo-white.
      var wordmark = doc.querySelector("img.lunario-wordmark");
      if (wordmark) {
        wordmark.setAttribute("src", "branding/lunario/assets/logo.svg");
      }
      if (doc.querySelector(".site-shell-nav")) return;
      var row = doc.querySelector(".header-primary-row");
      var brand = row && row.querySelector("a.brand, .brand");
      if (!row || !brand) return;
      if (!doc.getElementById("lunario-site-shell-nav-style")) {
        var style = doc.createElement("style");
        style.id = "lunario-site-shell-nav-style";
        style.textContent =
          ".header-brand-cluster{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}" +
          ".site-shell-nav{display:flex;align-items:center}" +
          ".site-shell-nav__about{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:9px;" +
          "text-decoration:none;color:#303b29;font-size:13px;font-weight:500;letter-spacing:.01em;" +
          "border:1px solid #80785666;background:#fffef9;box-shadow:0 1px 0 #3c412014;white-space:nowrap}" +
          ".site-shell-nav__about:hover{border-color:#6d7651a0;background:#fff}" +
          "html[data-ui-theme=dark] .site-shell-nav__about{color:#f5eee2;background:#1b1d20;border-color:#897868;box-shadow:none}" +
          "html[data-ui-theme=dark] .site-shell-nav__about:hover{background:#24272b;border-color:#a08f7a}";
        doc.head.appendChild(style);
      }
      var cluster = doc.createElement("div");
      cluster.className = "header-brand-cluster";
      brand.parentNode.insertBefore(cluster, brand);
      brand.setAttribute("href", "../../");
      brand.setAttribute("target", "_top");
      brand.setAttribute("aria-label", "Lunario home");
      cluster.appendChild(brand);
      var nav = doc.createElement("nav");
      nav.className = "site-shell-nav";
      nav.setAttribute("aria-label", "Site");
      nav.innerHTML =
        '<a class="site-shell-nav__about" href="../../about.html" target="_top" aria-label="About the project">About the project</a>';
      cluster.appendChild(nav);
    } catch (e) {
      // Ignore if the frame document is not ready.
    }
  }

  function reveal() {
    if (settled) return;
    settled = true;
    if (mount) mount.classList.add("dash__mount--ready");
    if (status) status.hidden = true;
    try {
      if (frame && frame.contentDocument) preferDarkInFrame(frame.contentDocument);
    } catch (e) {}
    injectCreamSiteNav();
    // Touchdown: altitude lands at 0, then the loader lifts to show the dashboard.
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }

  function fail(message) {
    if (status) {
      status.hidden = false;
      status.classList.add("dash__status--error");
      status.innerHTML = message +
        ' <a class="dash__direct" href="navigator/public/solarreach-navigator.html">Open the navigator directly</a>';
    }
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }

  if (!frame) {
    fail("The dashboard frame is missing.");
    return;
  }

  frame.addEventListener("load", reveal);
  frame.addEventListener("error", function () {
    fail("The navigator could not be loaded.");
  });

  // If the browser restored a cached frame before listeners attached, settle soon.
  try {
    if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
      reveal();
    }
  } catch (e) {
    // Cross-origin or not yet available — wait for the load event.
  }

  // Safety: never leave the brand loader up forever if load is delayed.
  window.setTimeout(function () {
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }, 45000);
})();
</script>
</body>
</html>
