<!doctype html>
<html lang="en">
<head>
<!-- Loader first, so the dashboard never flashes before it. Plays once per tab session.
     Stays up until the navigator iframe finishes loading (large offline bundle). -->
<link rel="stylesheet" href="loader/loader.css">
<script src="loader/loader.js" data-min-duration="1800" data-once="session" data-auto-hide="false"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#0B0D12">
<meta property="og:title" content="Lunario">
<meta property="og:description" content="Lunar south pole landing dashboard">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rian-beep.github.io/Lunario/">
<meta property="og:image" content="https://rian-beep.github.io/Lunario/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<title>Lunario · Dashboard</title>
<meta name="description" content="Compare lunar landing sites and dates: Sun and Earth against the real horizon for power and direct-to-Earth contact.">
</head>
<body>
<header class="nav">
  <a class="nav__brand" href="./" aria-label="Lunario home"><img src="assets/logo.svg" alt="Lunario" width="123" height="26"></a>
  <nav aria-label="Main">
    <ul class="nav__links">
      <li><a href="./" aria-current="page">Dashboard</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</header>
<main class="dash dash--live" id="dashboard">
  <div class="dash__mount" id="dashboard-root">
    <p class="dash__status" id="dashboard-status" role="status">
      Loading the lunar landing site navigator…
      <a class="dash__direct" href="navigator/public/solarreach-navigator.html">Open the navigator directly</a>
    </p>
    <iframe
      class="dash__frame"
      id="navigator-frame"
      title="Lunario lunar landing site navigator"
      src="navigator/public/solarreach-navigator.html"
      allow="clipboard-write; fullscreen"
      loading="eager"
    ></iframe>
  </div>
</main>
<script>
(function () {
  var frame = document.getElementById("navigator-frame");
  var status = document.getElementById("dashboard-status");
  var mount = document.getElementById("dashboard-root");
  var settled = false;

  function reveal() {
    if (settled) return;
    settled = true;
    if (mount) mount.classList.add("dash__mount--ready");
    if (status) status.hidden = true;
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }

  function fail(message) {
    if (status) {
      status.hidden = false;
      status.classList.add("dash__status--error");
      status.innerHTML = message +
        ' <a class="dash__direct" href="navigator/public/solarreach-navigator.html">Open the navigator directly</a>';
    }
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }

  if (!frame) {
    fail("The dashboard frame is missing.");
    return;
  }

  frame.addEventListener("load", reveal);
  frame.addEventListener("error", function () {
    fail("The navigator could not be loaded.");
  });

  // If the browser restored a cached frame before listeners attached, settle soon.
  try {
    if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
      reveal();
    }
  } catch (e) {
    // Cross-origin or not yet available — wait for the load event.
  }

  // Safety: never leave the brand loader up forever if load is delayed.
  window.setTimeout(function () {
    var loader = window.Lunario && window.Lunario.loader;
    if (loader && typeof loader.hide === "function") loader.hide();
  }, 45000);
})();
</script>
</body>
</html>
