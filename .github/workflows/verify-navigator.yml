name: Verify Lunario navigator

on:
  pull_request:
    paths:
      - 'navigator/**'
      - '.github/workflows/verify-navigator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: navigator
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navigator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install PDF source-replay dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install scientific audit dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/lunario-science-python"
          "$RUNNER_TEMP/lunario-science-python/bin/python" -m pip install -r pipeline/audit-requirements.txt
          echo "$RUNNER_TEMP/lunario-science-python/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/compile-scientific-verification.py --check
      - run: npm test
      - run: npm run typecheck -- --incremental false
      - run: npm run lint
      - run: npm run standalone
      - name: Upload verified standalone navigator
        uses: actions/upload-artifact@v7
        with:
          name: lunario-standalone
          path: navigator/public/solarreach-navigator.html
          if-no-files-found: error
          retention-days: 3
